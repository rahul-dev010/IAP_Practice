resources:
  jobs:
    fk_t12_daily_pipeline:
      name: fk_t12_daily_pipeline
      email_notifications:
        on_failure:
          - rahulpatel@cyntexa.com
      schedule:
        quartz_cron_expression: 39 0 18 * * ?
        timezone_id: Asia/Calcutta
        pause_status: PAUSED
      tasks:
        - task_key: ingest_bronze
          notebook_task:
            notebook_path: /Workspace/Users/rahulpatel@cyntexa.com/IAP_Practice/freshkart/01_bronze
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 1800000
          retry_on_timeout: true
          disable_auto_optimization: false
        - task_key: silver_reference
          depends_on:
            - task_key: ingest_bronze
          notebook_task:
            notebook_path: /Workspace/Users/rahulpatel@cyntexa.com/IAP_Practice/freshkart/02_silver_reference
            source: WORKSPACE
          min_retry_interval_millis: 1800000
          disable_auto_optimization: false
        - task_key: silver_orders
          depends_on:
            - task_key: silver_reference
          notebook_task:
            notebook_path: /Workspace/Users/rahulpatel@cyntexa.com/IAP_Practice/freshkart/03_silver_orders
            source: WORKSPACE
          min_retry_interval_millis: 1800000
          disable_auto_optimization: false
        - task_key: gold_build
          depends_on:
            - task_key: silver_orders
          notebook_task:
            notebook_path: /Workspace/Users/rahulpatel@cyntexa.com/IAP_Practice/freshkart/04_gold
            source: WORKSPACE
          min_retry_interval_millis: 1800000
          disable_auto_optimization: false
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: fk_t12
      performance_target: PERFORMANCE_OPTIMIZED
